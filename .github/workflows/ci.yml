name: CI

on:
  push:
    branches: [smallscope]
  pull_request:

jobs:
  check:
    name: ruff + tests
    runs-on: ubuntu-latest
    env:
      # Every Python file Carrel owns. The vendored upstream cps/ tree carries
      # its own style and is deliberately not listed. Defined once so the two
      # ruff steps cannot disagree; a new Carrel module goes here and nowhere
      # else. This list had drifted to three entries, which is how an unused
      # variable and two unformatted files reached the branch unchallenged.
      CARREL_PY: >-
        tests/
        cps/carrel_search.py
        cps/categories.py
        cps/library_cache.py
        cps/page_count.py
        cps/palette.py
        cps/reading_shelf.py
        cps/quarry_grid.py
        cps/series_info.py
        cps/single_user.py
        cps/smallscope.py
        cps/stats.py
        cps/saved_searches.py
        cps/reader_state.py
        cps/wings.py
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        # python-magic loads libmagic at import; Wand loads the ImageMagick
        # library. cps imports both at app-creation time, which the tests
        # exercise by building the real Flask app against a fixture DB.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmagic1 \
            imagemagick \
            libxml2-dev \
            libxslt1-dev \
            zlib1g-dev

      - uses: actions/setup-python@v5
        with:
          # cquarry (the Wings evaluation engine) requires >= 3.14 and uses
          # 3.14 exception syntax, so Wings can't import on 3.13.
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff==0.15.20

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install cquarry (Wings evaluation engine)
        # Wings routes evaluate virtual libraries through cquarry's search
        # port (cps/wings.py: `from cquarry.db import CalibreDB`). It lives in a
        # sibling repo, not requirements.txt, so install it here or the Wings
        # tests 404. Pinned to a tag (not @main) so a sibling-repo push cannot
        # redden this CI with no fork change; bump the pin deliberately.
        run: pip install "git+https://github.com/VirInvictus/cquarry.git@v1.17.0"

      - name: ruff check
        run: ruff check $CARREL_PY

      - name: ruff format --check
        run: ruff format --check $CARREL_PY

      - name: unittest
        run: python -m unittest discover -s tests
